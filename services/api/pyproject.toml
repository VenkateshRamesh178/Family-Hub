[project]
name = "family-hub-api"
version = "0.0.0"
description = "Family Hub API (paid edition backend, run locally for now)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.11",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  # Document storage on S3 (DOCS_STORAGE=s3). Imported lazily, so local storage works without AWS.
  # [crt]: needed to use credentials from `aws login` (the family-hub-dev profile chains from it).
  "boto3[crt]>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
