server {
    listen 80;
    root /usr/share/nginx/html;

    # With local document storage, uploads come through here (DOCS_MAX_UPLOAD_MB is 25).
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads straight to the API rather than buffering them to disk first.
        proxy_request_buffering off;
    }

    # The service worker and app shell must be re-checked, or a new build never shows up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built assets have content hashes in their names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/docs, /calendar, ...) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
